[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "StockGuidance"
version = "0.1.0"
description = "Daily close-to-close training, recommendations and cash-rest simulation"
requires-python = ">=3.13"
dependencies = ["exchange-calendars>=4.11,<5", "tzdata>=2024.1", "numpy>=2.1,<3"]

[project.scripts]
update_market_data = "stockguidance.cli.update_market_data:main"
update_openings = "stockguidance.cli.update_openings:main"
validate_database = "stockguidance.cli.validate_database:main"
train_model = "stockguidance.cli.train_model:main"
recommend = "stockguidance.cli.recommend:main"
simulate_trading = "stockguidance.cli.simulate:main"
stockguidance_batch = "stockguidance.cli.batch:main"
incremental_training = "stockguidance.cli.incremental:main"
inspect_features = "stockguidance.cli.inspect_features:main"
inspect_reports = "stockguidance.cli.reports:main"
compare_signals = "stockguidance.cli.compare_signals:main"
compare_database_downloads = "stockguidance.cli.compare_database_downloads:main"
archive_study = "stockguidance.cli.archive_study:main"
verify_archive_sample = "stockguidance.cli.verify_archive_sample:main"
compare_archive_sample = "stockguidance.cli.compare_archive_sample:main"
preview_schema = "stockguidance.cli.preview_schema:main"
update_zscores = "stockguidance.cli.update_zscores:main"
maintain_daily = "stockguidance.cli.maintain_daily:main"
legacy_migration = "stockguidance.cli.legacy_migration:main"
legacy_migration_benchmark = "stockguidance.cli.legacy_migration_benchmark:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "mypy>=1.15"]
training = ["torch>=2.6,<3"]
database = ["mysql-connector-python>=9,<10"]
viewers = ["streamlit>=1.40,<2"]

[tool.setuptools]
py-modules = ["polygon_fetch"]
package-dir = {"" = ".", stockguidance = "src/stockguidance"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["stockguidance*"]
namespaces = false

[tool.setuptools.package-data]
stockguidance = ["py.typed", "database/table_names.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.13"
files = ["src/stockguidance"]
strict = true
